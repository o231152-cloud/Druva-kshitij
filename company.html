<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard | Ayush-Setu</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo"><i class="fas fa-leaf"></i> AYUSH-SETU</div>
        <ul class="nav-links">
            <li><a href="company.html" class="active">Dashboard</a></li>
            <li><a href="index.html" class="logout" onclick="logout()">Logout</a></li>
        </ul>
        <div class="user-info"><i class="fas fa-building"></i> Google India</div>
    </div>
</nav>

<div class="dashboard-container">
    <div class="welcome-banner company">
        <h1>Welcome, Google India! 🏢</h1>
        <p>Post jobs, find skilled candidates, and manage your recruitment</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-briefcase"></i>
            <div class="stat-info"><h3>12</h3><p>Active Job Posts</p></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-users"></i>
            <div class="stat-info"><h3>245</h3><p>Applications</p></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-user-check"></i>
            <div class="stat-info"><h3>38</h3><p>Shortlisted</p></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-handshake"></i>
            <div class="stat-info"><h3>8</h3><p>Hired</p></div>
        </div>
    </div>

    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> Post a New Job</h2>
        <form class="job-form" id="jobForm" onsubmit="postJob(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" placeholder="e.g., Software Developer" required>
                </div>
                <div class="form-group">
                    <label>Job Type</label>
                    <select id="jobType">
                        <option>Full-Time</option>
                        <option>Internship</option>
                        <option>Apprenticeship</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Required Skills (comma separated)</label>
                    <input type="text" id="jobSkills" placeholder="e.g., Python, React, Docker" required>
                </div>
                <div class="form-group">
                    <label>Experience Required</label>
                    <select id="jobExperience">
                        <option>Fresher</option>
                        <option>0-1 years</option>
                        <option>1-3 years</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Post Job</button>
        </form>
        <div id="jobPostResult"></div>
    </div>

    <div class="card">
        <h2><i class="fas fa-user-check"></i> Top Matched Candidates</h2>
        <div class="candidate-list" id="candidateList">
            <p>Loading candidates...</p>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadCompanyDashboard);
</script>
</body>
</html>
